name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 静态校验（Windows/Linux 可跑）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Validate project files
        run: python tools/validate_project.py

  build:
    name: 编译检查（macOS）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project Wobi.xcodeproj -list

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Wobi.xcodeproj \
            -scheme Wobi \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
